name: AI LinkedIn Agent Scheduler

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allow manual triggering from GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push database updates back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all branches and history

      - name: Fetch database history
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/db-state && git cat-file -e origin/db-state:history/history.db 2>/dev/null; then
            git checkout origin/db-state -- history/history.db
            echo "Successfully loaded history database from db-state branch."
          else
            echo "No database file found on db-state branch, starting with a clean database."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional email secrets
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.EMAIL_NOTIFICATION_SECRET }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python app.py

      - name: Commit and push database changes
        run: |
          # Save the updated database file temporarily
          cp history/history.db history.db.tmp
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Fetch and switch to db-state branch (or create it)
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/db-state; then
            git checkout db-state
            git pull origin db-state
          else
            git checkout -b db-state
          fi
          
          # Restore the updated database file
          mkdir -p history
          mv history.db.tmp history/history.db
          
          # Commit and push changes directly to the db-state branch (which is not blocked by main rulesets)
          git add history/history.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "database: update history [skip ci]" && git push origin db-state)


